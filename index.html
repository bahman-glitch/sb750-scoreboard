<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>SB750 Scoreboard</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap">
<style>
/* Layout: arena scoreboard. One dark, rink-at-night look on purpose; huge condensed numerals, ice-blue chrome, goal-light red for work, bench green for rest, gold for personal bests. */
:root {
  --ice: #0a121c;        /* page ground */
  --boards: #111d2b;     /* raised surfaces */
  --boards-2: #172738;   /* inputs, hover */
  --line: #253a52;       /* hairlines */
  --chalk: #e9f0f7;      /* main text */
  --muted: #8ea3ba;      /* secondary text */
  --blue: #5cc8ff;       /* chrome accent, buttons */
  --goal: #ff4b3e;       /* work phase */
  --bench: #3ddc8f;      /* rest phase */
  --gold: #ffc53d;       /* personal best */
  --on-accent: #06101a;
  --display: "Barlow Condensed", "Arial Narrow", "Roboto Condensed", Impact, sans-serif;
  --body: "Inter", -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  --r: 14px;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { background: var(--ice); }
body {
  color: var(--chalk);
  font-family: var(--body);
  font-size: 16px;
  line-height: 1.45;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 0 32px;
  -webkit-tap-highlight-color: transparent;
  min-height: 100%;
}
button, input, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 3px solid var(--blue); outline-offset: 2px; }
.num { font-family: var(--display); font-variant-numeric: tabular-nums; letter-spacing: .01em; }
h1, h2, h3 { font-family: var(--display); font-weight: 700; letter-spacing: .02em; text-wrap: balance; margin: 0; line-height: 1.05; }
h1 { font-size: clamp(2rem, 5vw, 2.8rem); text-transform: uppercase; }
h2 { font-size: 1.6rem; text-transform: uppercase; }
h3 { font-size: 1.25rem; }
.label { font-size: .72rem; text-transform: uppercase; letter-spacing: .12em; color: var(--muted); font-weight: 600; }
.muted { color: var(--muted); }
.wrap { max-width: 1100px; margin: 0 auto; display: grid; gap: 22px; }

/* Top bar */
.top {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5;
  background: var(--ice);
  display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
  padding-block: 12px; border-bottom: 1px solid var(--line);
  max-width: 1100px; margin: 0 auto 22px;
}
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--ice); }
.brand { font-family: var(--display); font-weight: 800; font-size: 1.4rem; letter-spacing: .06em; text-transform: uppercase; margin-right: auto; display: flex; align-items: center; gap: 8px; }
.brand i { width: 12px; height: 12px; border-radius: 50%; background: var(--goal); box-shadow: 0 0 10px var(--goal); display: inline-block; }
.nav { display: flex; gap: 6px; flex-wrap: wrap; }
.nav button { background: transparent; border: 1px solid transparent; border-radius: 999px; padding: 8px 14px; color: var(--muted); font-weight: 600; font-size: .92rem; }
.nav button[aria-current="page"] { color: var(--chalk); border-color: var(--line); background: var(--boards); }
.pill { display: inline-flex; align-items: center; gap: 8px; border-radius: 999px; padding: 8px 14px; border: 1px solid var(--line); background: var(--boards); font-weight: 600; font-size: .9rem; }
.pill .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--muted); }
.pill[data-s="on"] .dot { background: var(--bench); box-shadow: 0 0 8px var(--bench); }
.pill[data-s="demo"] .dot { background: var(--gold); }
.pill[data-s="connecting"] .dot { background: var(--blue); animation: blink 1s infinite; }
.pill[data-s="lost"] .dot { background: var(--goal); }
@keyframes blink { 50% { opacity: .25; } }

/* Buttons */
.btn { border: 1px solid var(--line); background: var(--boards-2); border-radius: 12px; padding: 12px 18px; font-weight: 600; min-height: 48px; }
.btn.primary { background: var(--blue); border-color: var(--blue); color: var(--on-accent); }
.btn.go { background: var(--goal); border-color: var(--goal); color: #fff; font-family: var(--display); font-size: 1.5rem; letter-spacing: .06em; text-transform: uppercase; padding: 10px 26px; }
.btn.ghost { background: transparent; }
.btn.danger { color: var(--goal); border-color: color-mix(in srgb, var(--goal) 45%, var(--line)); background: transparent; }
.btn.small { min-height: 38px; padding: 6px 12px; font-size: .9rem; }
.row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }

/* Panels */
.panel { background: var(--boards); border: 1px solid var(--line); border-radius: var(--r); padding: 20px; display: grid; gap: 14px; min-width: 0; }
.notice { border-left: 4px solid var(--gold); background: var(--boards); border-radius: 10px; padding: 12px 16px; }
.notice.bad { border-left-color: var(--goal); }

/* Riders */
.riders { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 14px; }
.rider-tile { background: var(--boards); border: 1px solid var(--line); border-radius: var(--r); padding: 22px 16px; display: grid; justify-items: center; gap: 10px; text-align: center; min-height: 190px; align-content: center; }
.rider-tile:hover { background: var(--boards-2); }
.avatar { width: 76px; height: 76px; border-radius: 50%; display: grid; place-items: center; font-family: var(--display); font-weight: 800; font-size: 2rem; color: var(--on-accent); }
.avatar.sm { width: 34px; height: 34px; font-size: 1rem; }
.rider-tile .name { font-family: var(--display); font-size: 1.6rem; font-weight: 700; text-transform: uppercase; letter-spacing: .03em; line-height: 1; }
.add-tile { border-style: dashed; color: var(--muted); }
.add-tile .plus { font-family: var(--display); font-size: 3rem; line-height: 1; color: var(--blue); }
.swatches { display: flex; gap: 10px; flex-wrap: wrap; }
.swatch { width: 40px; height: 40px; border-radius: 50%; border: 3px solid transparent; }
.swatch[aria-pressed="true"] { border-color: var(--chalk); }
input[type="text"], textarea { background: var(--boards-2); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; width: 100%; min-width: 0; }
textarea { min-height: 120px; font-family: ui-monospace, Menlo, monospace; font-size: .85rem; }

/* Workouts */
.workouts { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 14px; }
.wk { background: var(--boards); border: 1px solid var(--line); border-radius: var(--r); padding: 20px; display: grid; gap: 12px; grid-template-rows: auto auto 1fr auto; min-width: 0; }
.wk .tag { color: var(--blue); }
.wk .pb { display: flex; align-items: baseline; gap: 8px; border-top: 1px solid var(--line); padding-top: 12px; }
.wk .pb .num { font-size: 2.4rem; color: var(--gold); line-height: 1; }
.shape { display: flex; gap: 3px; align-items: flex-end; height: 26px; }
.shape span { display: block; border-radius: 2px; }
.shape .w { background: var(--goal); height: 26px; }
.shape .r { background: var(--bench); height: 8px; opacity: .8; }

/* Ride */
.ride { display: grid; gap: 16px; grid-template-columns: 1.15fr 1fr; align-items: stretch; }
@media (max-width: 820px) { .ride { grid-template-columns: 1fr; } }
.clock { border-radius: var(--r); padding: 22px; display: grid; gap: 6px; align-content: center; justify-items: center; text-align: center; border: 2px solid var(--line); background: var(--boards); transition: background .2s, border-color .2s; min-height: 340px; }
.clock[data-phase="work"] { background: color-mix(in srgb, var(--goal) 20%, var(--boards)); border-color: var(--goal); }
.clock[data-phase="rest"] { background: color-mix(in srgb, var(--bench) 12%, var(--boards)); border-color: var(--bench); }
.phase { font-family: var(--display); font-weight: 800; font-size: clamp(2.2rem, 6vw, 3.4rem); letter-spacing: .08em; text-transform: uppercase; line-height: 1; }
.clock[data-phase="work"] .phase { color: var(--goal); }
.clock[data-phase="rest"] .phase { color: var(--bench); }
.clock[data-phase="prep"] .phase { color: var(--blue); }
.secs { font-size: clamp(7rem, 20vw, 12rem); font-weight: 800; line-height: .9; }
.side { display: grid; gap: 16px; align-content: start; min-width: 0; }
.watts { display: flex; align-items: baseline; gap: 10px; }
.watts .num { font-size: clamp(4.5rem, 12vw, 6.5rem); font-weight: 800; line-height: .9; }
.watts .unit { font-family: var(--display); font-size: 1.8rem; color: var(--muted); }
.minis { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.mini { background: var(--boards-2); border-radius: 10px; padding: 10px 12px; }
.mini .num { font-size: 2rem; font-weight: 700; line-height: 1; }
.versus { display: grid; gap: 10px; }
.vs-nums { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; flex-wrap: wrap; }
.vs-nums .num { font-size: 2.6rem; font-weight: 800; line-height: 1; }
.bar { position: relative; height: 18px; background: var(--boards-2); border-radius: 999px; overflow: hidden; }
.bar .fill { position: absolute; inset: 0 auto 0 0; background: var(--blue); border-radius: 999px; transition: width .25s; }
.bar .fill.ahead { background: var(--gold); }
.bar .ghost { position: absolute; top: -2px; bottom: -2px; width: 3px; background: var(--chalk); border-radius: 2px; transition: left .25s; }

/* Results */
.hero-score { text-align: center; display: grid; gap: 6px; justify-items: center; padding-block: 10px; }
.hero-score .big { font-size: clamp(6rem, 18vw, 9.5rem); font-weight: 800; line-height: .85; }
.hero-score .big small { font-size: .3em; color: var(--muted); margin-left: .15em; }
.badge { display: inline-block; font-family: var(--display); font-weight: 800; letter-spacing: .1em; text-transform: uppercase; padding: 6px 16px; border-radius: 999px; font-size: 1.2rem; }
.badge.pb { background: var(--gold); color: var(--on-accent); animation: pop .5s ease-out; }
@keyframes pop { from { transform: scale(.7); } to { transform: scale(1); } }
.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 10px; }
.stat { background: var(--boards); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; }
.stat .num { font-size: 2rem; font-weight: 700; line-height: 1.05; }
.tablebox { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
th, td { text-align: left; padding: 10px 8px; border-bottom: 1px solid var(--line); white-space: nowrap; }
th { font-size: .72rem; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
td.r, th.r { text-align: right; }
.chip { font-size: .7rem; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; padding: 2px 7px; border-radius: 6px; background: var(--boards-2); color: var(--gold); margin-left: 6px; }

/* History and board */
.grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 14px; }
.spark { width: 100%; height: 70px; display: block; }
.tabs { display: flex; gap: 6px; flex-wrap: wrap; }
.tabs button { border: 1px solid var(--line); background: transparent; border-radius: 999px; padding: 8px 14px; font-weight: 600; color: var(--muted); }
.tabs button[aria-pressed="true"] { background: var(--chalk); color: var(--on-accent); border-color: var(--chalk); }
.rank { font-family: var(--display); font-size: 1.6rem; font-weight: 800; color: var(--muted); width: 2ch; }
.who { display: flex; align-items: center; gap: 10px; font-weight: 600; }

/* Modal and toast */
.scrim { position: fixed; inset: 0; background: rgb(0 0 0 / .6); display: grid; place-items: center; z-index: 20; padding: 20px; }
.modal { background: var(--boards); border: 1px solid var(--line); border-radius: var(--r); padding: 22px; max-width: 460px; width: 100%; display: grid; gap: 14px; }
.toast { position: fixed; left: 50%; bottom: calc(20px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--chalk); color: var(--on-accent); padding: 12px 18px; border-radius: 12px; font-weight: 600; z-index: 30; max-width: min(92vw, 560px); box-shadow: 0 8px 30px rgb(0 0 0 / .4); }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
</style>
</head>
<body>

<header class="top" id="top"></header>
<main class="wrap" id="main"></main>
<div id="layer"></div>

<script>
"use strict";
/* ---------- Workouts ---------- */
var WORKOUTS = [
  { id: "sprint", name: "10-second sprint", tag: "First-step speed", rounds: 3, work: 10, rest: 60, score: "peak", unit: "W",
    blurb: "Three all-out 10-second sprints with a minute to recover. Score is your peak watts." },
  { id: "tabata", name: "Tabata 20/10", tag: "Repeat sprints", rounds: 8, work: 20, rest: 10, score: "kcal", unit: "cal",
    blurb: "Eight rounds of 20 seconds hard, 10 seconds easy. Score is total calories." },
  { id: "shift", name: "Shift intervals", tag: "Shift-length effort", rounds: 6, work: 30, rest: 90, score: "avgWork", unit: "W",
    blurb: "Six 30-second shifts with 90 seconds on the bench. Score is your average watts while working." }
];
var PREP = 5;
var COLORS = ["#5cc8ff", "#ff8a3d", "#b48cff", "#3ddc8f", "#ffc53d", "#ff6b9a"];
var STORE_KEY = "sb750-scoreboard-v1";

function wk(id) { for (var i = 0; i < WORKOUTS.length; i++) if (WORKOUTS[i].id === id) return WORKOUTS[i]; return WORKOUTS[0]; }
function totalSecs(w) { return w.rounds * w.work + (w.rounds - 1) * w.rest; }
function fmtDur(s) { var m = Math.floor(s / 60), r = s % 60; return m + ":" + (r < 10 ? "0" : "") + r; }

/* ---------- Storage ---------- */
var storageOk = true;
function load() {
  try {
    var t = localStorage.getItem(STORE_KEY);
    if (t) { var d = JSON.parse(t); if (d && Array.isArray(d.riders) && Array.isArray(d.sessions)) return d; }
  } catch (e) { storageOk = false; }
  return { version: 1, riders: [], sessions: [] };
}
var db = load();
function save() {
  try { localStorage.setItem(STORE_KEY, JSON.stringify(db)); storageOk = true; }
  catch (e) { storageOk = false; toast("Couldn't save on this device. Copy a backup from Settings."); }
}
function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 7); }
function esc(s) { return String(s).replace(/[&<>"']/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]; }); }
function rider(id) { for (var i = 0; i < db.riders.length; i++) if (db.riders[i].id === id) return db.riders[i]; return null; }
function initials(n) { var p = String(n).trim().split(/\s+/); return ((p[0] || "?")[0] + (p[1] ? p[1][0] : "")).toUpperCase(); }
function sessionsFor(rid, wid, demo) {
  return db.sessions.filter(function (s) { return s.riderId === rid && (!wid || s.workout === wid) && (demo === undefined || !!s.demo === demo); })
    .sort(function (a, b) { return a.date - b.date; });
}
function bestFor(rid, wid, demo) {
  var best = null;
  sessionsFor(rid, wid, !!demo).forEach(function (s) { if (best === null || s.score > best) best = s.score; });
  return best;
}

/* ---------- App state ---------- */
var app = { screen: "riders", riderId: null, result: null, board: "sprint", boardSort: "best", adding: false, addColor: COLORS[0], restoreOpen: false };

/* ---------- FTMS Indoor Bike Data (0x2AD2) ---------- */
function parseIndoorBikeData(dv) {
  var r = {}, o = 0;
  try {
    var f = dv.getUint16(o, true); o += 2;
    if (!(f & 1)) { r.speed = dv.getUint16(o, true) / 100; o += 2; }       // km/h
    if (f & 2) o += 2;                                                     // average speed
    if (f & 4) { r.cadence = dv.getUint16(o, true) / 2; o += 2; }          // rpm
    if (f & 8) o += 2;                                                     // average cadence
    if (f & 16) { r.distance = dv.getUint8(o) | (dv.getUint8(o + 1) << 8) | (dv.getUint8(o + 2) << 16); o += 3; } // metres
    if (f & 32) o += 2;                                                    // resistance
    if (f & 64) { r.power = dv.getInt16(o, true); o += 2; }               // watts
    if (f & 128) o += 2;                                                   // average power
    if (f & 256) { var e = dv.getUint16(o, true); if (e !== 0xFFFF) r.energy = e; o += 5; } // kcal total
    if (f & 512) { var h = dv.getUint8(o); if (h > 0) r.hr = h; o += 1; }
  } catch (err) { /* short packet: keep what we parsed */ }
  return r;
}

/* ---------- Bike connection ---------- */
var bike = { status: "off", device: null, live: {}, lastAt: 0, demo: false, demoTimer: null };
function setStatus(s) { bike.status = s; renderTop(); if (app.screen === "workouts") render(); }
function onPacket(dv) {
  var r = parseIndoorBikeData(dv);
  for (var k in r) bike.live[k] = r[k];
  bike.lastAt = performance.now();
}
function niceErr(e) {
  var n = e && e.name;
  if (n === "NotFoundError") return "No bike picked. Pedal to wake the console, then try again. If it never shows up, use Show all devices in Settings.";
  if (n === "SecurityError") return "This page isn't allowed to use Bluetooth here. Open it directly in Bluefy.";
  if (n === "NetworkError") return "Lost the connection to the bike. Pedal to wake it and reconnect.";
  return "Couldn't connect: " + (e && e.message ? e.message : "unknown error");
}
function hasBluetooth() { return !!(navigator.bluetooth && navigator.bluetooth.requestDevice); }
function connectBike(all) {
  if (!hasBluetooth()) {
    modal("Bluetooth isn't available in this browser",
      "<p>Safari can't talk to Bluetooth devices. Open this page in the free Bluefy app on the iPad to connect the SB750. You can try everything in Demo mode right now.</p>",
      [{ label: "Use Demo mode", cls: "primary", fn: startDemo }, { label: "Close" }]);
    return;
  }
  setStatus("connecting");
  var opts = all ? { acceptAllDevices: true, optionalServices: [0x1826] } : { filters: [{ services: [0x1826] }] };
  navigator.bluetooth.requestDevice(opts).then(function (device) {
    bike.device = device;
    device.addEventListener("gattserverdisconnected", function () { if (bike.status === "on") setStatus("lost"); });
    return attach(device);
  }).catch(function (e) { setStatus(bike.device ? "lost" : "off"); toast(niceErr(e)); });
}
function attach(device) {
  return device.gatt.connect()
    .then(function (server) { return server.getPrimaryService(0x1826); })
    .then(function (svc) { return svc.getCharacteristic(0x2AD2); })
    .then(function (ch) {
      ch.addEventListener("characteristicvaluechanged", function (ev) { onPacket(ev.target.value); });
      return ch.startNotifications();
    })
    .then(function () { stopDemo(); setStatus("on"); toast("Bike connected. Pedal to see live watts."); });
}
function reconnect() {
  if (!bike.device) return connectBike(false);
  setStatus("connecting");
  attach(bike.device).catch(function (e) { setStatus("lost"); toast(niceErr(e)); });
}
function disconnectBike() {
  try { if (bike.device && bike.device.gatt.connected) bike.device.gatt.disconnect(); } catch (e) {}
  bike.device = null; setStatus("off");
}

/* Demo: builds real FTMS packets so the same parser is exercised */
function buildPacket(p) {
  var buf = new ArrayBuffer(2 + 2 + 2 + 3 + 2 + 5), dv = new DataView(buf), o = 0;
  dv.setUint16(o, 4 | 16 | 64 | 256, true); o += 2;
  dv.setUint16(o, Math.round(p.speed * 100), true); o += 2;
  dv.setUint16(o, Math.round(p.cadence * 2), true); o += 2;
  var d = Math.round(p.distance); dv.setUint8(o, d & 255); dv.setUint8(o + 1, (d >> 8) & 255); dv.setUint8(o + 2, (d >> 16) & 255); o += 3;
  dv.setInt16(o, Math.round(p.power), true); o += 2;
  dv.setUint16(o, Math.floor(p.energy), true); dv.setUint16(o + 2, 0, true); dv.setUint8(o + 4, 0); o += 5;
  return dv;
}
function startDemo() {
  if (bike.device) disconnectBike();
  stopDemo();
  bike.demo = true;
  var st = { power: 0, distance: 0, energy: 0, strength: 300 + Math.random() * 140, last: performance.now() };
  bike.demoTimer = setInterval(function () {
    var now = performance.now(), dt = (now - st.last) / 1000; st.last = now;
    var ph = ride ? ride.phases[ride.idx] : null;
    var target = 40;
    if (ph && ph.type === "work") {
      var into = (now - ride.phaseStart) / 1000;
      var fade = Math.max(0.55, 1 - ph.round * 0.04 - into * 0.012);
      target = st.strength * fade * (into < 1.5 ? 1.25 : 1);
    } else if (ph && ph.type === "rest") target = 70;
    st.power += (target - st.power) * 0.35 + (Math.random() - 0.5) * 18;
    st.power = Math.max(0, st.power);
    var cadence = st.power > 5 ? 22 + Math.sqrt(st.power) * 3.4 : 0;
    var speed = cadence * 0.42;
    st.distance += speed / 3.6 * dt;
    st.energy += st.power * dt / 1000 * 1.15;
    onPacket(buildPacket({ power: st.power, cadence: cadence, speed: speed, distance: st.distance, energy: st.energy }));
  }, 250);
  setStatus("demo");
  toast("Demo mode: a simulated rider. Demo rides are tagged and kept out of personal bests.");
}
function stopDemo() {
  if (bike.demoTimer) clearInterval(bike.demoTimer);
  bike.demoTimer = null; bike.demo = false;
  if (bike.status === "demo") bike.status = "off";
}
function dataFresh() { return performance.now() - bike.lastAt < 3000; }

/* ---------- Sound and screen ---------- */
var audio = null, wakeLock = null;
function initAudio() {
  try { if (!audio) audio = new (window.AudioContext || window.webkitAudioContext)(); if (audio.state === "suspended") audio.resume(); } catch (e) { audio = null; }
}
function beep(freq, dur) {
  if (!audio) return;
  try {
    var o = audio.createOscillator(), g = audio.createGain();
    o.type = "square"; o.frequency.value = freq;
    g.gain.setValueAtTime(0.18, audio.currentTime);

  if (mx === mn) { mx += 1; mn -= 1; }

  var line = pts.map(function (p) { return p[0].toFixed(1) + "," + p[1].toFixed(1); }).join(" ");
  var area = pad + "," + (H - pad) + " " + line + " " + pts[pts.length - 1][0].toFixed(1) + "," + (H - pad);
  var bi = vals.indexOf(Math.max.apply(null, vals)), last = pts[pts.length - 1];
  return '<svg class="spark" viewBox="0 0 ' + W + " " + H + '" preserveAspectRatio="none" role="img" aria-label="Scores over time">' +
    '<line x1="' + pad + '" x2="' + (W - pad) + '" y1="' + (H - pad) + '" y2="' + (H - pad) + '" stroke="var(--line)"/>' +
    '<polygon points="' + area + '" fill="' + color + '" fill-opacity=".14"/>' +
    '<polyline points="' + line + '" fill="none" stroke="' + color + '" stroke-width="2.5" vector-effect="non-scaling-stroke"/>' +
    '<circle cx="' + pts[bi][0] + '" cy="' + pts[bi][1] + '" r="4.5" fill="var(--gold)"/>' +
    '<circle cx="' + last[0] + '" cy="' + last[1] + '" r="3.5" fill="var(--chalk)"/></svg>';
}
function viewHistory() {
  if (!db.riders.length) return '<h1>History</h1><div class="notice">Add a rider and finish a ride to start a history.</div>';
  var r = rider(app.riderId) || db.riders[0]; app.riderId = r.id;
  var pick = '<div class="tabs">' + db.riders.map(function (x) { return '<button data-hr="' + x.id + '" aria-pressed="' + (x.id === r.id) + '">' + esc(x.name) + "</button>"; }).join("") + "</div>";
  var cards = WORKOUTS.map(function (w) {
    var ss = sessionsFor(r.id, w.id, false), pb = bestFor(r.id, w.id, false);
    return '<div class="panel"><div class="row" style="justify-content:space-between;align-items:baseline"><h3>' + w.name + '</h3><span class="muted">' + ss.length + " rides</span></div>" +
      '<div class="row" style="align-items:baseline;gap:8px"><span class="num" style="font-size:2.4rem;color:var(--gold);line-height:1">' + fmtScore(w, pb) + '</span><span class="label">' + w.unit + " best</span></div>" +
      spark(ss.slice(-20).map(function (s) { return s.score; }), r.color) + "</div>";
  }).join("");
  var all = sessionsFor(r.id).slice().reverse().slice(0, 40);
  var rows = all.map(function (s) {
    var w = wk(s.workout), d = new Date(s.date);
    return "<tr><td>" + d.toLocaleDateString(undefined, { month: "short", day: "numeric" }) + " " + d.toLocaleTimeString(undefined, { hour: "numeric", minute: "2-digit" }) +
      "</td><td>" + w.name + (s.demo ? '<span class="chip">Demo</span>' : "") + '</td><td class="r num" style="font-size:1.3rem">' + fmtScore(w, s.score) + " " + w.unit +
      '</td><td class="r">' + s.peakW + '</td><td class="r"><button class="btn small ghost" data-del="' + s.id + '" aria-label="Delete ride">Delete</button></td></tr>';
  }).join("");
  return '<h1>History</h1>' + pick + '<div class="grid2">' + cards + "</div>" +
    '<div class="panel"><h3>Recent rides</h3>' + (rows ? '<div class="tablebox"><table><thead><tr><th>When</th><th>Workout</th><th class="r">Score</th><th class="r">Peak W</th><th></th></tr></thead><tbody>' + rows + "</tbody></table></div>" : '<p class="muted" style="margin:0">No rides yet.</p>') + "</div>";
}
bind.history = function () {
  document.querySelectorAll("[data-hr]").forEach(function (b) { b.onclick = function () { app.riderId = b.dataset.hr; render(); }; });
  document.querySelectorAll("[data-del]").forEach(function (b) {
    b.onclick = function () {
      modal("Delete this ride?", "<p>It will be removed from history and personal bests.</p>", [
        { label: "Delete", cls: "danger", fn: function () { db.sessions = db.sessions.filter(function (s) { return s.id !== b.dataset.del; }); save(); render(); } },
        { label: "Keep it", cls: "primary" }]);
    };
  });
};

/* Family board */
function viewBoard() {
  var w = wk(app.board);
  var rows = db.riders.map(function (r) {
    var ss = sessionsFor(r.id, w.id, false); if (!ss.length) return null;
    var best = bestFor(r.id, w.id, false), first = ss[0].score;
    var imp = ss.length > 1 && first > 0 ? (best - first) / first * 100 : null;
    return { r: r, best: best, first: first, imp: imp, n: ss.length };
  }).filter(Boolean);
  rows.sort(app.boardSort === "best" ? function (a, b) { return b.best - a.best; } : function (a, b) { return (b.imp == null ? -1e9 : b.imp) - (a.imp == null ? -1e9 : a.imp); });
  var body = rows.map(function (x, i) {
    return '<tr><td><span class="rank">' + (i + 1) + '</span></td><td><span class="who"><span class="avatar sm" style="background:' + x.r.color + '">' + esc(initials(x.r.name)) + "</span>" + esc(x.r.name) +
      '</span></td><td class="r num" style="font-size:1.5rem">' + fmtScore(w, x.best) + '</td><td class="r">' + fmtScore(w, x.first) +
      '</td><td class="r" style="color:' + (x.imp > 0 ? "var(--bench)" : "var(--muted)") + '">' + (x.imp == null ? "—" : (x.imp >= 0 ? "+" : "") + x.imp.toFixed(0) + "%") + '</td><td class="r">' + x.n + "</td></tr>";
  }).join("");
  return '<section style="display:grid;gap:8px"><h1>Family board</h1><p class="muted">Kids and adults put out very different watts, so “Most improved” compares each rider’s best with their own first score.</p></section>' +
    '<div class="tabs">' + WORKOUTS.map(function (x) { return '<button data-bw="' + x.id + '" aria-pressed="' + (x.id === w.id) + '">' + x.name + "</button>"; }).join("") + "</div>" +
    '<div class="tabs"><button data-bs="best" aria-pressed="' + (app.boardSort === "best") + '">Best score</button><button data-bs="imp" aria-pressed="' + (app.boardSort === "imp") + '">Most improved</button></div>' +
    '<div class="panel">' + (body ? '<div class="tablebox"><table><thead><tr><th></th><th>Rider</th><th class="r">Best ' + w.unit + '</th><th class="r">First</th><th class="r">Improved</th><th class="r">Rides</th></tr></thead><tbody>' + body + "</tbody></table></div>"
      : '<p class="muted" style="margin:0">No one has ridden ' + w.name + " yet. Demo rides don’t count here.</p>") + "</div>";
}
bind.board = function () {
  document.querySelectorAll("[data-bw]").forEach(function (b) { b.onclick = function () { app.board = b.dataset.bw; render(); }; });
  document.querySelectorAll("[data-bs]").forEach(function (b) { b.onclick = function () { app.boardSort = b.dataset.bs; render(); }; });
};

/* Settings */
function csv() {
  var head = ["date", "rider", "workout", "score", "unit", "peak_watts", "avg_working_watts", "calories", "calories_estimated", "distance_m", "top_speed_kmh", "max_hr", "demo"];
  var lines = [head.join(",")];
  db.sessions.slice().sort(function (a, b) { return a.date - b.date; }).forEach(function (s) {
    var r = rider(s.riderId);
    lines.push([new Date(s.date).toISOString(), '"' + (r ? r.name : "").replace(/"/g, '""') + '"', wk(s.workout).name, s.score, s.unit, s.peakW, s.avgWorkW, s.kcal, s.kcalEstimated ? "yes" : "no", s.distM, s.peakKmh, s.maxHr || "", s.demo ? "yes" : "no"].join(","));
  });
  return lines.join("\n");
}
function copyText(t, okMsg) {
  var done = function () { toast(okMsg); };
  var fallback = function () {
    modal("Copy this text", '<p class="muted">Select all and copy, then paste it into Notes or Files.</p><textarea id="cpy" readonly>' + esc(t) + "</textarea>", [{ label: "Done", cls: "primary" }]);
    var ta = document.getElementById("cpy"); if (ta) { ta.focus(); ta.select(); }
  };
  try { navigator.clipboard.writeText(t).then(done, fallback); } catch (e) { fallback(); }
}
function downloadText(t, name, type) {
  try {
    var url = URL.createObjectURL(new Blob([t], { type: type })), a = document.createElement("a");
    a.href = url; a.download = name; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(function () { URL.revokeObjectURL(url); }, 4000);
    toast("If nothing downloaded, use Copy instead.");
  } catch (e) { toast("This browser can't download files. Use Copy instead."); }
}
function viewSettings() {
  var demoCount = db.sessions.filter(function (s) { return s.demo; }).length;
  var riders = db.riders.map(function (r) {
    return '<div class="row" style="justify-content:space-between;border-bottom:1px solid var(--line);padding-block:8px"><span class="who"><span class="avatar sm" style="background:' + r.color + '">' + esc(initials(r.name)) + "</span>" + esc(r.name) +
      '</span><span class="row"><button class="btn small" data-ren="' + r.id + '">Rename</button><button class="btn small danger" data-rdel="' + r.id + '">Remove</button></span></div>';
  }).join("");
  return '<h1>Settings</h1><div class="grid2">' +
    '<div class="panel"><h3>Bike</h3><p class="muted" style="margin:0">' + statusText() + (hasBluetooth() ? "." : ". This browser can’t use Bluetooth; open the page in Bluefy.") + "</p>" +
    '<div class="row"><button class="btn primary" id="sConn">Connect bike</button><button class="btn" id="sAll">Show all devices</button>' +
    (bike.status === "on" ? '<button class="btn ghost" id="sDisc">Disconnect</button>' : "") + "</div>" +
    '<div class="row"><button class="btn" id="sDemo">' + (bike.demo ? "Stop demo mode" : "Start demo mode") + "</button></div>" +
    '<p class="muted" style="margin:0;font-size:.9rem">Use “Show all devices” only if the SB750 doesn’t appear with Connect bike. It usually shows up with “SOLE” or “SB750” in the name.</p></div>' +
    '<div class="panel"><h3>Riders</h3>' + (riders || '<p class="muted" style="margin:0">No riders yet.</p>') + "</div>" +
    '<div class="panel"><h3>Backup</h3><p class="muted" style="margin:0">Rides are saved in this browser on this iPad only. Clearing website data or deleting the browser app erases them, so copy a backup now and then and paste it into Notes or iCloud Drive.</p>' +
    '<div class="row"><button class="btn primary" id="bCopy">Copy backup</button><button class="btn" id="bDl">Download backup</button></div>' +
    '<div class="row"><button class="btn" id="cCopy">Copy as spreadsheet (CSV)</button><button class="btn" id="cDl">Download CSV</button></div>' +
    (app.restoreOpen ? '<label class="label" for="restoreText">Paste a backup</label><textarea id="restoreText" placeholder="{&quot;version&quot;:1,…}"></textarea><div class="row"><button class="btn primary" id="rGo">Replace everything with this backup</button><button class="btn ghost" id="rCancel">Cancel</button></div>'
      : '<div class="row"><button class="btn ghost" id="rOpen">Restore from a backup…</button></div>') + "</div>" +
    '<div class="panel"><h3>Demo rides</h3><p class="muted" style="margin:0">' + demoCount + " demo ride" + (demoCount === 1 ? "" : "s") + " saved. They’re tagged and never count toward bests or the family board.</p>" +
    '<div class="row"><button class="btn danger" id="dDel"' + (demoCount ? "" : " disabled") + ">Delete demo rides</button></div></div></div>";
}
bind.settings = function () {
  document.getElementById("sConn").onclick = function () { connectBike(false); };
  document.getElementById("sAll").onclick = function () { connectBike(true); };
  var dc = document.getElementById("sDisc"); if (dc) dc.onclick = disconnectBike;
  document.getElementById("sDemo").onclick = function () { if (bike.demo) { stopDemo(); setStatus("off"); render(); } else { startDemo(); render(); } };
  document.querySelectorAll("[data-ren]").forEach(function (b) {
    b.onclick = function () {
      var r = rider(b.dataset.ren);
      modal("Rename rider", '<input type="text" id="renName" maxlength="20" value="' + esc(r.name) + '">', [
        { label: "Save", cls: "primary", fn: function () {} }, { label: "Cancel", cls: "ghost" }]);
      var btn = document.querySelector("#mbtns .primary");
      btn.onclick = function () { var v = document.getElementById("renName").value.trim(); if (v) { r.name = v; save(); } document.getElementById("layer").innerHTML = ""; render(); };
    };
  });
  document.querySelectorAll("[data-rdel]").forEach(function (b) {
    b.onclick = function () {
      var r = rider(b.dataset.rdel), n = sessionsFor(r.id).length;
      modal("Remove " + r.name + "?", "<p>This also deletes their " + n + " ride" + (n === 1 ? "" : "s") + ". Copy a backup first if you might want them later.</p>", [
        { label: "Remove", cls: "danger", fn: function () { db.riders = db.riders.filter(function (x) { return x.id !== r.id; }); db.sessions = db.sessions.filter(function (s) { return s.riderId !== r.id; }); if (app.riderId === r.id) app.riderId = null; save(); render(); } },
        { label: "Cancel", cls: "primary" }]);
    };
  });
  var stamp = new Date().toISOString().slice(0, 10);
  document.getElementById("bCopy").onclick = function () { copyText(JSON.stringify(db), "Backup copied. Paste it into Notes or a file in iCloud Drive."); };
  document.getElementById("bDl").onclick = function () { downloadText(JSON.stringify(db, null, 1), "sb750-backup-" + stamp + ".json", "application/json"); };
  document.getElementById("cCopy").onclick = function () { copyText(csv(), "Spreadsheet copied. Paste into Numbers or Google Sheets."); };
  document.getElementById("cDl").onclick = function () { downloadText(csv(), "sb750-rides-" + stamp + ".csv", "text/csv"); };
  var ro = document.getElementById("rOpen"); if (ro) ro.onclick = function () { app.restoreOpen = true; render(); };
  var rc = document.getElementById("rCancel"); if (rc) rc.onclick = function () { app.restoreOpen = false; render(); };
  var rg = document.getElementById("rGo"); if (rg) rg.onclick = function () {
    var d; try { d = JSON.parse(document.getElementById("restoreText").value); } catch (e) { d = null; }
    if (!d || !Array.isArray(d.riders) || !Array.isArray(d.sessions)) { toast("That doesn't look like a scoreboard backup. Paste the whole text from Copy backup."); return; }
    modal("Replace everything?", "<p>This replaces " + db.riders.length + " riders and " + db.sessions.length + " rides with " + d.riders.length + " riders and " + d.sessions.length + " rides from the backup.</p>", [
      { label: "Replace", cls: "danger", fn: function () { db = { version: 1, riders: d.riders, sessions: d.sessions }; save(); app.restoreOpen = false; app.riderId = null; render(); toast("Backup restored."); } },
      { label: "Cancel", cls: "primary" }]);
  };
  document.getElementById("dDel").onclick = function () {
    db.sessions = db.sessions.filter(function (s) { return !s.demo; }); save(); render(); toast("Demo rides deleted.");
  };
};

render();
</script>
</body>
</html>
